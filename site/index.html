<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Світло · Power</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('uptime.theme')}catch(e){}document.documentElement.dataset.mode=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
<link rel="stylesheet" href="./css/style.css">
<script type="module" src="./js/app.js"></script>
</head>
<body>
<div class="ui" id="ui"><div class="in">

  <header class="hd">
    <div class="ubrand"><span class="logo"></span><span data-i18n="brand"></span></div>
    <div class="live" id="live"><span class="pulse"></span><span class="txt"></span></div>
    <div class="seg" id="lseg" role="radiogroup" data-i18n-aria="language"><button data-l="uk" role="radio">УКР</button><button data-l="en" role="radio">ENG</button></div>
    <div class="seg" id="tseg" role="radiogroup" data-i18n-aria="appearance">
      <button data-t="auto" role="radio" data-i18n-aria="theme_auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg><span data-i18n="theme_auto"></span></button>
      <button data-t="light" role="radio" data-i18n-aria="theme_light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i18n="theme_light"></span></button>
      <button data-t="dark" role="radio" data-i18n-aria="theme_dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg><span data-i18n="theme_dark"></span></button>
    </div>
  </header>

  <p class="banner" id="banner" role="status" hidden></p>
  <p class="lede" id="lede"></p>
  <div class="scards" id="cards"></div>

  <section id="summary">
    <div class="sh"><h3 data-i18n="summary"></h3>
      <div class="right">
        <div class="seg" id="pseg" role="radiogroup" data-i18n-aria="summary"><button data-p="day" role="radio" aria-checked="false" data-i18n="period_day"></button><button data-p="week" role="radio" aria-checked="true" class="on" data-i18n="period_week"></button><button data-p="month" role="radio" aria-checked="false" data-i18n="period_month"></button></div>
        <div class="pnav"><button data-nav="1" data-i18n-aria="earlier">‹</button><span id="plabel"></span><button data-nav="-1" data-i18n-aria="later">›</button></div>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section id="days">
    <div class="sh"><h3 data-i18n="last14"></h3><span class="sub" id="tlsub"></span>
      <div class="right legend">
        <span><i style="background:var(--seg-on)"></i><span data-i18n="legend_on"></span></span>
        <span><i style="background:var(--seg-off)"></i><span data-i18n="legend_off"></span></span>
        <span><i style="background:repeating-linear-gradient(-45deg,var(--seg-net) 0 2.5px,transparent 2.5px 5px)"></i><span data-i18n="legend_net"></span></span>
        <span><i style="background:var(--faint)"></i><span data-i18n="legend_reboot"></span></span>
      </div>
    </div>
    <div class="panel"><div class="tl" id="tl"></div></div>
  </section>

  <section id="bars">
    <div class="sh"><h3 data-i18n="bars_title"></h3><span class="sub" data-i18n="bars_sub"></span></div>
    <div class="sm" id="sm"></div>
  </section>

  <section id="pattern">
    <div class="sh"><h3 data-i18n="pattern_title"></h3><span class="sub" data-i18n="pattern_sub"></span></div>
    <div class="panel" id="heat"></div>
  </section>

  <section id="events">
    <div class="sh"><h3 data-i18n="events"></h3>
      <div class="right"><div class="seg" id="fseg" role="radiogroup" data-i18n-aria="events"></div><button class="ghost" id="csv" data-i18n="export_csv"></button></div>
    </div>
    <div class="panel" id="log"></div>
  </section>

  <footer class="ft"><span data-i18n="footer"></span><br><span data-i18n="limits"></span></footer>
</div><div class="tip" id="tip" role="tooltip"></div></div>

<template id="icons">
  <svg data-i="on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
  <svg data-i="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/><path d="M3 3l18 18"/></svg>
  <svg data-i="reboot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5M20 3.5v5h-5"/></svg>
  <svg data-i="power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9M17.7 6.3a8 8 0 1 1-11.4 0"/></svg>
  <svg data-i="warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17.5v.01"/></svg>
  <svg data-i="wait" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
</template>
</body>
</html>
