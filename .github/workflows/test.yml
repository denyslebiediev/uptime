name: test
on: push
permissions: { contents: read }
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci && npm test
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: for tz in Europe/Kyiv UTC America/New_York; do TZ=$tz node --test 'site/test/*.test.js' || exit 1; done
  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck pi/uptime-hb pi/install.sh pi/test/run.sh pi/test/bin/curl pi/test/bin/systemctl && bash pi/test/run.sh
